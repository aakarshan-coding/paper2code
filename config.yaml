# paper2code configuration. Every key here has a matching field on paper2code.config.Config.
runs_root: runs
categories: [cs.LG, cs.CL, stat.ML]
budget:
  limit_usd: 10.0
caps:
  test_runs: 25
  wall_clock_s: 7200      # 2 h on Max 5x; use 14400 on Max 20x
  stall_n: 5
min_seeds: 3
max_fulltext_candidates: 10
run_tests_timeout_s: 900
gpu_type: T4
max_tier: 5x
policy: select_v1_testability
llm: openai                 # openai | fake (fake = offline plumbing check, no API calls)
pass_one_batch_size: 25     # abstracts per scout pass-one call
max_fulltext_chars: 80000   # full text sent to pass two is cut here (~20k tokens)
shortlist_size: 3
gpu_usd_per_hour: 1.0       # used by the scout to turn est_gpu_hours into est_usd
models:
  scout_pass1: gpt-5.4-nano   # cheapest classifier, hundreds of abstracts a day
  scout_pass2: gpt-5.5        # strongest reasoning model, at most max_fulltext_candidates calls a day
  scoper: gpt-5.5
  inspector: gpt-5.5
  builder: ""                 # empty = Agent SDK default under the subscription
prices:                       # USD per 1M tokens, checked 2026-10-06
  gpt-5.4-nano: {input: 0.20, output: 1.25}
  gpt-5.4-mini: {input: 0.75, output: 4.50}
  gpt-5.5: {input: 5.00, output: 30.00}

allowed_packages: [numpy, torch, scipy, scikit-learn]   # what scoped tests and builder code may import; the stub check runs locally
builder_max_turns: 200        # Agent SDK turn cap; the wall-clock cap is the real limit
builder_tool_timeout_s: 300   # one bash call inside the workspace

modal_app_name: paper2code     # deployed with `python -m modal deploy src/paper2code/sandbox/modal_app.py`
sandbox_allowed_domains: [pypi.org, files.pythonhosted.org, download.pytorch.org]   # plus hosts named in spec.md
sandbox_cpu: 2.0
sandbox_memory_mb: 4096
payload_max_mb: 50             # a run_tests snapshot bigger than this is refused
inspector_max_chars: 300000    # paper + spec + tests + workspace + build log sent to the inspector, about 75k tokens; the first real paper was 58k chars

runs_repo_url: "https://github.com/aakarshan-coding/paper2code-runs"   # empty = local directory, no push
notify_url: ""                 # POST a JSON summary here when a daily run finishes; empty = off
daily_builder: agent           # what `paper2code daily` uses
schedule_cron: "0 13 * * *"    # UTC; read at deploy time for daily_run (redeploy after changing; PAPER2CODE_SCHEDULE overrides)
test_function_timeout_s: 1800  # read at deploy time for run_tests_remote; must exceed run_tests_timeout_s (preflight checks)
